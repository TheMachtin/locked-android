name: Tests

# Läuft auch auf Pull Requests. Die Bau-Workflows greifen erst auf main, ein
# plattformabhängiger Fehler fiel dadurch erst nach dem Merge auf — genau so ist
# der Windows-Build am Test-Glob gescheitert, das unter PowerShell nicht
# expandiert. Hier laufen nur die Tests, keine Pakete: ein bis zwei Minuten
# statt zehn.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '20' }
      # Der Kern hängt nur an Node-Builtins — kein npm install nötig.
      - name: Tests
        run: npm test
