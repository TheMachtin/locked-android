name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write   # für Release-Upload

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
      KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with: { fetch-depth: 0 }

      - name: Set up Node
        uses: actions/setup-node@v4
        with: { node-version: '20' }

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Compute version
        id: ver
        run: |
          # Anzahl der Commits als versionCode; Kurz-Hash als Suffix
          CODE=$(git rev-list --count HEAD)
          NAME="1.0.${CODE}"
          HASH=$(git rev-parse --short HEAD)
          echo "code=$CODE" >> $GITHUB_OUTPUT
          echo "name=$NAME" >> $GITHUB_OUTPUT
          echo "hash=$HASH" >> $GITHUB_OUTPUT
          echo "Building version $NAME (code $CODE)"

      - name: Bake version into www/index.html
        run: |
          sed -i "s|__APP_VERSION__|${{ steps.ver.outputs.name }}|g" www/index.html || true
          sed -i "s|__APP_COMMIT__|${{ steps.ver.outputs.hash }}|g" www/index.html || true

      - name: Install npm dependencies
        run: npm install

      - name: Run tests
        run: npm test

      - name: Add Android platform
        run: npx cap add android || true

      - name: Generate app icons + splash
        run: npx @capacitor/assets generate --android || true

      - name: Sync web assets to native
        run: npx cap sync android

      - name: Install AppInstaller plugin + FileProvider (native)
        run: |
          # Java-Klassen kopieren
          mkdir -p android/app/src/main/java/app/locked/themachtin/plugins
          cp native/java/AppInstallerPlugin.java android/app/src/main/java/app/locked/themachtin/plugins/
          cp native/java/MainActivity.java android/app/src/main/java/app/locked/themachtin/MainActivity.java
          # FileProvider Paths-XML
          mkdir -p android/app/src/main/res/xml
          cp native/xml/file_provider_paths.xml android/app/src/main/res/xml/
          # AndroidManifest patchen: REQUEST_INSTALL_PACKAGES + FileProvider
          python3 << 'PY'
          import re
          p = 'android/app/src/main/AndroidManifest.xml'
          with open(p) as f: c = f.read()
          if 'REQUEST_INSTALL_PACKAGES' not in c:
              c = c.replace('<application',
                  '<uses-permission android:name="android.permission.REQUEST_INSTALL_PACKAGES" />\n    <application', 1)
          if 'FileProvider' not in c:
              fp = ('        <provider\n'
                    '            android:name="androidx.core.content.FileProvider"\n'
                    '            android:authorities="${applicationId}.fileprovider"\n'
                    '            android:exported="false"\n'
                    '            android:grantUriPermissions="true">\n'
                    '            <meta-data\n'
                    '                android:name="android.support.FILE_PROVIDER_PATHS"\n'
                    '                android:resource="@xml/file_provider_paths" />\n'
                    '        </provider>\n')
              c = c.replace('</application>', fp + '    </application>', 1)
          # OAuth-Rücksprung aus dem System-Browser: locked://auth
          if 'android:scheme="locked"' not in c:
              flt = ('            <intent-filter>\n'
                     '                <action android:name="android.intent.action.VIEW" />\n'
                     '                <category android:name="android.intent.category.DEFAULT" />\n'
                     '                <category android:name="android.intent.category.BROWSABLE" />\n'
                     '                <data android:scheme="locked" android:host="auth" />\n'
                     '            </intent-filter>\n')
              # erstes </activity> = MainActivity; Einrückung des Tags übernehmen
              m = re.search(r'\n([ \t]*)</activity>', c)
              assert m, 'kein </activity> im Manifest'
              c = c[:m.start()] + '\n' + flt + m.group(1) + '</activity>' + c[m.end():]
          with open(p, 'w') as f: f.write(c)
          for needle in ('REQUEST_INSTALL_PACKAGES', 'FileProvider', 'android:scheme="locked"'):
              assert needle in c, f'Manifest-Patch fehlgeschlagen: {needle}'
          print('Manifest patched OK')
          PY

      - name: Configure app version + name
        run: |
          # applicationId & version in android/app/build.gradle setzen
          sed -i "s|versionCode 1|versionCode ${{ steps.ver.outputs.code }}|" android/app/build.gradle
          sed -i "s|versionName \"1.0\"|versionName \"${{ steps.ver.outputs.name }}\"|" android/app/build.gradle
          # App-Name
          sed -i 's|<string name="app_name">.*</string>|<string name="app_name">Locked</string>|' android/app/src/main/res/values/strings.xml || true
          sed -i 's|<string name="title_activity_main">.*</string>|<string name="title_activity_main">Locked</string>|' android/app/src/main/res/values/strings.xml || true

      - name: Decode keystore
        if: env.KEYSTORE_BASE64 != ''
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > android/app/locked-release.jks
          ls -la android/app/locked-release.jks

      - name: Configure signing
        if: env.KEYSTORE_BASE64 != ''
        run: |
          # Whitespace/Newlines aus Passwort trimmen (falls beim Copy-Paste eingeschleppt)
          KP=$(printf '%s' "$KEYSTORE_PASSWORD" | tr -d '[:space:]')
          # keystore.properties statt Inline in build.gradle → sicher gegen Sonderzeichen
          cat > android/keystore.properties << EOF
          storeFile=locked-release.jks
          storePassword=$KP
          keyAlias=locked
          keyPassword=$KP
          EOF
          cat >> android/app/build.gradle << 'GRADLE_EOF'

          android {
              signingConfigs {
                  release {
                      def props = new Properties()
                      def propsFile = rootProject.file('keystore.properties')
                      if (propsFile.exists()) { props.load(propsFile.newDataInputStream()) }
                      storeFile file(props.getProperty('storeFile'))
                      storePassword props.getProperty('storePassword')
                      keyAlias props.getProperty('keyAlias')
                      keyPassword props.getProperty('keyPassword')
                  }
              }
              buildTypes {
                  release { signingConfig signingConfigs.release }
              }
          }
          GRADLE_EOF

      - name: Build APK
        working-directory: android
        run: |
          chmod +x gradlew
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "Signed release build"
            ./gradlew assembleRelease --no-daemon
          else
            echo "⚠ Kein KEYSTORE_BASE64 Secret gesetzt — baue Debug-APK"
            ./gradlew assembleDebug --no-daemon
          fi

      - name: Locate APK
        id: apk
        run: |
          APK=$(find android/app/build/outputs -name "*.apk" | head -1)
          echo "path=$APK" >> $GITHUB_OUTPUT
          echo "Found APK: $APK"

      - name: Upload APK as artifact
        uses: actions/upload-artifact@v4
        with:
          name: locked-${{ steps.ver.outputs.name }}
          path: ${{ steps.apk.outputs.path }}
          retention-days: 90

      - name: Create/update GitHub Release
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.ver.outputs.name }}
          name: v${{ steps.ver.outputs.name }}
          body: |
            Automatischer Build vom Commit ${{ steps.ver.outputs.hash }}.
            APK zum Download unten.
          files: ${{ steps.apk.outputs.path }}
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
