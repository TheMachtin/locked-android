name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write   # für Release-Upload

jobs:
  build:
    runs-on: ubuntu-latest
    # Denselben Release erzeugt auch der Desktop-Workflow. Die gemeinsame
    # Gruppe verhindert, dass beide gleichzeitig anlegen wollen; die Builds
    # selbst laufen weiter parallel.
    concurrency:
      group: release-${{ github.sha }}
      cancel-in-progress: false
    env:
      KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
      KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with: { fetch-depth: 0 }

      - name: Set up Node
        uses: actions/setup-node@v4
        with: { node-version: '20' }

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Compute version
        id: ver
        run: |
          # Anzahl der Commits als versionCode; Kurz-Hash als Suffix
          CODE=$(git rev-list --count HEAD)
          NAME="2.1.${CODE}"
          HASH=$(git rev-parse --short HEAD)
          echo "code=$CODE" >> $GITHUB_OUTPUT
          echo "name=$NAME" >> $GITHUB_OUTPUT
          echo "hash=$HASH" >> $GITHUB_OUTPUT
          echo "Building version $NAME (code $CODE)"

      - name: Version eintragen
        run: ./scripts/bake-version.sh "${{ steps.ver.outputs.name }}" "${{ steps.ver.outputs.hash }}"

      - name: Install npm dependencies
        run: npm install

      - name: Run tests
        run: npm test

      - name: Add Android platform
        run: npx cap add android || true

      - name: Generate app icons + splash
        run: npx @capacitor/assets generate --android || true

      - name: Sync web assets to native
        run: npx cap sync android

      - name: Install native plugins + FileProvider
        run: |
          # Java-Klassen kopieren
          mkdir -p android/app/src/main/java/app/locked/themachtin/plugins
          cp native/java/AppInstallerPlugin.java android/app/src/main/java/app/locked/themachtin/plugins/
          cp native/java/ShortcutsPlugin.java android/app/src/main/java/app/locked/themachtin/plugins/
          cp native/java/WearCommandService.java android/app/src/main/java/app/locked/themachtin/plugins/
          cp native/java/WearBridgePlugin.java android/app/src/main/java/app/locked/themachtin/plugins/
          cp native/java/MainActivity.java android/app/src/main/java/app/locked/themachtin/MainActivity.java
          # Uhr-Modul: eigenes APK, gleiche Anwendungs-ID, gleicher Schlüssel
          rm -rf android/wear
          cp -r native/wear android/wear
          # Mit führendem Zeilenumbruch: Capacitors settings.gradle endet ohne einen,
          # sonst klebt das include an der letzten Zeile („apply from: …include ':wear'").
          grep -q "include ':wear'" android/settings.gradle || printf "\ninclude ':wear'\n" >> android/settings.gradle
          # Datenkanal zur Uhr braucht Play Services auch auf der Telefon-Seite
          grep -q "play-services-wearable" android/app/build.gradle || cat >> android/app/build.gradle << 'GRADLE_EOF'

          dependencies {
              implementation 'com.google.android.gms:play-services-wearable:18.1.0'
          }
          GRADLE_EOF
          # FileProvider Paths-XML
          mkdir -p android/app/src/main/res/xml
          cp native/xml/file_provider_paths.xml android/app/src/main/res/xml/
          # AndroidManifest patchen: REQUEST_INSTALL_PACKAGES + FileProvider
          python3 << 'PY'
          import re
          p = 'android/app/src/main/AndroidManifest.xml'
          with open(p) as f: c = f.read()
          if 'REQUEST_INSTALL_PACKAGES' not in c:
              c = c.replace('<application',
                  '<uses-permission android:name="android.permission.REQUEST_INSTALL_PACKAGES" />\n    <application', 1)
          # Ohne diese Deklaration listet Android die App unter „Über anderen Apps
          # anzeigen" gar nicht auf — und ohne den Schalter dort darf ein Kommando
          # von der Uhr die App nicht aus dem Hintergrund öffnen.
          if 'SYSTEM_ALERT_WINDOW' not in c:
              c = c.replace('<application',
                  '<uses-permission android:name="android.permission.SYSTEM_ALERT_WINDOW" />\n    <application', 1)
          if 'FileProvider' not in c:
              fp = ('        <provider\n'
                    '            android:name="androidx.core.content.FileProvider"\n'
                    '            android:authorities="${applicationId}.fileprovider"\n'
                    '            android:exported="false"\n'
                    '            android:grantUriPermissions="true">\n'
                    '            <meta-data\n'
                    '                android:name="android.support.FILE_PROVIDER_PATHS"\n'
                    '                android:resource="@xml/file_provider_paths" />\n'
                    '        </provider>\n')
              c = c.replace('</application>', fp + '    </application>', 1)
          # Nachrichten der Uhr (siehe native/java/WearCommandService.java)
          if 'WearCommandService' not in c:
              svc = ('        <service\n'
                     '            android:name="app.locked.themachtin.plugins.WearCommandService"\n'
                     '            android:exported="true">\n'
                     '            <intent-filter>\n'
                     '                <action android:name="com.google.android.gms.wearable.MESSAGE_RECEIVED" />\n'
                     '                <data android:scheme="wear" android:host="*" android:pathPrefix="/locked" />\n'
                     '            </intent-filter>\n'
                     '        </service>\n')
              c = c.replace('</application>', svc + '    </application>', 1)
          # Eigenes Schema: locked://auth ist der OAuth-Rücksprung aus dem
          # System-Browser, locked://log das Kommando eines Shortcuts oder einer
          # Automation (siehe www/js/core/command.js).
          def add_filter(c, host):
              if f'android:host="{host}"' in c: return c
              flt = ('            <intent-filter>\n'
                     '                <action android:name="android.intent.action.VIEW" />\n'
                     '                <category android:name="android.intent.category.DEFAULT" />\n'
                     '                <category android:name="android.intent.category.BROWSABLE" />\n'
                     f'                <data android:scheme="locked" android:host="{host}" />\n'
                     '            </intent-filter>\n')
              # erstes </activity> = MainActivity; Einrückung des Tags übernehmen
              m = re.search(r'\n([ \t]*)</activity>', c)
              assert m, 'kein </activity> im Manifest'
              return c[:m.start()] + '\n' + flt + m.group(1) + '</activity>' + c[m.end():]
          c = add_filter(c, 'auth')
          c = add_filter(c, 'log')
          with open(p, 'w') as f: f.write(c)
          for needle in ('REQUEST_INSTALL_PACKAGES', 'SYSTEM_ALERT_WINDOW', 'FileProvider',
                         'WearCommandService', 'android:host="auth"', 'android:host="log"'):
              assert needle in c, f'Manifest-Patch fehlgeschlagen: {needle}'
          print('Manifest patched OK')
          PY

      - name: Configure app version + name
        run: |
          # applicationId & version in android/app/build.gradle setzen
          sed -i "s|versionCode 1|versionCode ${{ steps.ver.outputs.code }}|" android/app/build.gradle
          sed -i "s|versionName \"1.0\"|versionName \"${{ steps.ver.outputs.name }}\"|" android/app/build.gradle
          # Uhr trägt dieselbe Nummer — sonst rät man später, welche zu welcher passt
          sed -i "s|versionCode 1|versionCode ${{ steps.ver.outputs.code }}|" android/wear/build.gradle
          sed -i "s|versionName \"1.0\"|versionName \"${{ steps.ver.outputs.name }}\"|" android/wear/build.gradle
          # App-Name
          sed -i 's|<string name="app_name">.*</string>|<string name="app_name">Locked</string>|' android/app/src/main/res/values/strings.xml || true
          sed -i 's|<string name="title_activity_main">.*</string>|<string name="title_activity_main">Locked</string>|' android/app/src/main/res/values/strings.xml || true

      - name: Decode keystore
        if: env.KEYSTORE_BASE64 != ''
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > android/app/locked-release.jks
          ls -la android/app/locked-release.jks

      - name: Configure signing
        if: env.KEYSTORE_BASE64 != ''
        run: |
          # Whitespace/Newlines aus Passwort trimmen (falls beim Copy-Paste eingeschleppt)
          KP=$(printf '%s' "$KEYSTORE_PASSWORD" | tr -d '[:space:]')
          # keystore.properties statt Inline in build.gradle → sicher gegen Sonderzeichen
          cat > android/keystore.properties << EOF
          storeFile=locked-release.jks
          storePassword=$KP
          keyAlias=locked
          keyPassword=$KP
          EOF
          cat >> android/app/build.gradle << 'GRADLE_EOF'

          android {
              signingConfigs {
                  release {
                      def props = new Properties()
                      def propsFile = rootProject.file('keystore.properties')
                      if (propsFile.exists()) { props.load(propsFile.newDataInputStream()) }
                      storeFile file(props.getProperty('storeFile'))
                      storePassword props.getProperty('storePassword')
                      keyAlias props.getProperty('keyAlias')
                      keyPassword props.getProperty('keyPassword')
                  }
              }
              buildTypes {
                  release { signingConfig signingConfigs.release }
              }
          }
          GRADLE_EOF

      - name: Build APK
        working-directory: android
        run: |
          chmod +x gradlew
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "Signed release build"
            ./gradlew :app:assembleRelease --no-daemon
          else
            echo "⚠ Kein KEYSTORE_BASE64 Secret gesetzt — baue Debug-APK"
            ./gradlew :app:assembleDebug --no-daemon
          fi

      - name: Locate APK
        id: apk
        run: |
          APK=$(find android/app/build/outputs -name "*.apk" | head -1)
          echo "path=$APK" >> $GITHUB_OUTPUT
          echo "Found APK: $APK"

      - name: Upload APK as artifact
        uses: actions/upload-artifact@v4
        with:
          name: locked-${{ steps.ver.outputs.name }}
          path: ${{ steps.apk.outputs.path }}
          retention-days: 90

      # Getrennt und *nach* dem Hochladen der Telefon-APK: bricht das Uhr-Modul,
      # ist der Fehler laut, aber die APK fürs Telefon liegt trotzdem am Lauf.
      - name: Build Wear APK
        working-directory: android
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            ./gradlew :wear:assembleRelease --no-daemon
          else
            ./gradlew :wear:assembleDebug --no-daemon
          fi

      - name: Locate Wear APK
        id: wear
        run: |
          APK=$(find android/wear/build/outputs -name "*.apk" | head -1)
          echo "path=$APK" >> $GITHUB_OUTPUT
          echo "Found Wear APK: $APK"

      - name: Upload Wear APK as artifact
        uses: actions/upload-artifact@v4
        with:
          name: locked-wear-${{ steps.ver.outputs.name }}
          path: ${{ steps.wear.outputs.path }}
          retention-days: 90

      # Denselben Release erzeugt auch der Desktop-Workflow. Die gemeinsame
      # Gruppe verhindert, dass beide gleichzeitig anlegen wollen.
      - name: Create/update GitHub Release
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.ver.outputs.name }}
          name: v${{ steps.ver.outputs.name }}
          body: |
            Automatischer Build vom Commit ${{ steps.ver.outputs.hash }}.

            - `app-release.apk` — fürs Telefon (antippen, installieren)
            - `wear-release.apk` — für die Galaxy Watch, siehe README → „Die Kachel auf die Uhr"
          files: |
            ${{ steps.apk.outputs.path }}
            ${{ steps.wear.outputs.path }}
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
