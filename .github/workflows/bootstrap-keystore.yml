name: Bootstrap Signing Keystore

# Einmal manuell ausführen, um einen Release-Keystore zu erzeugen.
# Der Keystore wird als Artifact zum Download bereitgestellt.
# Danach den base64-Inhalt als Repo-Secret KEYSTORE_BASE64 speichern.
# (Actions → Runs → Bootstrap Signing Keystore → Artifact herunterladen)

on:
  workflow_dispatch:

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    steps:
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Generate keystore
        id: gen
        run: |
          PASS=$(openssl rand -base64 24 | tr -d '=+/')
          keytool -genkeypair -v \
            -keystore locked-release.jks \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -alias locked \
            -storepass "$PASS" \
            -keypass "$PASS" \
            -dname "CN=Locked,O=TheMachtin,C=DE"
          base64 -w0 locked-release.jks > keystore.base64.txt
          echo "$PASS" > keystore.password.txt
          echo "----------------------------------------"
          echo "Passwort (auch als Secret speichern):"
          echo "$PASS"
          echo "----------------------------------------"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: locked-keystore
          path: |
            keystore.base64.txt
            keystore.password.txt
            locked-release.jks
          retention-days: 1
