name: Desktop-App bauen

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            ziel: --win
            muster: dist/*.exe
          - os: ubuntu-latest
            ziel: --linux
            muster: dist/*.AppImage
    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with: { fetch-depth: 0 }   # rev-list --count braucht die volle Historie

      - name: Node einrichten
        uses: actions/setup-node@v4
        with: { node-version: '20' }

      - name: Version bestimmen
        id: ver
        shell: bash
        run: |
          # Dieselbe Rechnung wie im APK- und im Pages-Build: Commit-Anzahl → 2.0.N.
          echo "name=2.0.$(git rev-list --count HEAD)" >> $GITHUB_OUTPUT
          echo "hash=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT

      - name: Abhängigkeiten installieren
        run: npm install

      - name: Tests
        # Ein kaputter Berechnungskern soll gar nicht erst als Installer enden.
        run: npm test

      - name: Version eintragen
        shell: bash
        run: ./scripts/bake-version.sh "${{ steps.ver.outputs.name }}" "${{ steps.ver.outputs.hash }}"

      - name: Paket bauen
        # Ohne Signatur — ein Code-Signing-Zertifikat kostet Geld und bringt für
        # eine App, die nur ihr Autor installiert, nichts. Windows zeigt beim
        # ersten Start SmartScreen: „Weitere Informationen" → „Trotzdem ausführen".
        run: npx electron-builder ${{ matrix.ziel }} --publish never

      - name: Artefakte hochladen
        uses: actions/upload-artifact@v4
        with:
          name: locked-desktop-${{ runner.os }}
          path: ${{ matrix.muster }}
          if-no-files-found: error
          retention-days: 90

  release:
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    # Der APK-Workflow legt denselben Release an. Ohne gemeinsame Gruppe würden
    # beide gleichzeitig zu erzeugen versuchen und einer davon scheitern. Der
    # Schlüssel hängt am Commit, blockiert also nur die Läufe, die sich
    # tatsächlich denselben Release teilen.
    concurrency:
      group: release-${{ github.sha }}
      cancel-in-progress: false
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with: { fetch-depth: 0 }

      - name: Version bestimmen
        id: ver
        run: echo "name=2.0.$(git rev-list --count HEAD)" >> $GITHUB_OUTPUT

      - name: Artefakte einsammeln
        uses: actions/download-artifact@v4
        with:
          pattern: locked-desktop-*
          merge-multiple: true
          path: pakete

      - name: An den Release hängen
        # Ohne name/body: den Titel setzt der APK-Workflow, hier kommen nur
        # Dateien dazu. Wer zuerst da ist, legt den Release an.
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.ver.outputs.name }}
          files: pakete/*
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
