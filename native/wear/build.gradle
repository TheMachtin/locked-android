// Die Uhr-App. Eigenes APK, aber dieselbe Anwendungs-ID und derselbe Schlüssel
// wie das Telefon — der Datenkanal von Google Play Services verbindet nur Apps,
// bei denen beides übereinstimmt.
apply plugin: 'com.android.application'

android {
    namespace "app.locked.themachtin.wear"
    compileSdk 34

    defaultConfig {
        applicationId "app.locked.themachtin"
        minSdk 30            // Wear OS 3 — ab Galaxy Watch 4
        targetSdk 34
        versionCode 1
        versionName "1.0"
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    signingConfigs {
        release {
            def propsFile = rootProject.file('keystore.properties')
            if (propsFile.exists()) {
                def props = new Properties()
                props.load(propsFile.newDataInputStream())
                // Der Keystore liegt im app-Modul; von hier aus über das Wurzelprojekt.
                storeFile rootProject.file('app/' + props.getProperty('storeFile'))
                storePassword props.getProperty('storePassword')
                keyAlias props.getProperty('keyAlias')
                keyPassword props.getProperty('keyPassword')
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            if (rootProject.file('keystore.properties').exists()) {
                signingConfig signingConfigs.release
            }
        }
    }
}

dependencies {
    implementation 'com.google.android.gms:play-services-wearable:18.1.0'
    implementation 'androidx.wear.tiles:tiles:1.4.1'
    implementation 'androidx.wear.protolayout:protolayout:1.2.1'
    implementation 'androidx.wear.protolayout:protolayout-material:1.2.1'
    implementation 'com.google.guava:guava:32.1.3-android'
}
